<!doctype html>
<html>
  <body>
    Status<br />
    <div id="status">Starting...</div>

    <input id="fileInput" type="file" style="display: none" />

    Video<br />
    <video
      id="video1"
      width="160"
      height="120"
      autoplay
      muted
      playsinline
    ></video>
  </body>
  <script>
    // sendFileCoordinator waits for file to be uploaded and data channel to be opened, then starts sending process
    const sendFileCoordinator = {
      file: null,
      dataChannel: null,
      delay: null,

      setFile(f) {
        this.file = f;
        this.tryProceed();
      },

      setDataChannel(dc) {
        this.dataChannel = dc;
        this.tryProceed();
      },

      setDelay(d) {
        this.delay = d;
        this.tryProceed();
      },

      tryProceed() {
        setStatus(
          `sendFileCoordinator: file: ${
            this.file ? this.file.name : "null"
          }, dataChannel: ${
            this.dataChannel ? "open" : "null"
          }, delay: ${this.delay}`,
        );
        if (this.file && this.dataChannel && this.delay !== null) {
          sendFileOverDC(this.dataChannel, this.file, this.delay);
        }
      },
    };

    // Listen for file selection
    document
      .getElementById("fileInput")
      .addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (file) {
          sendFileCoordinator.setFile(file);
        }
      });

    const remoteSignalURL = "__REMOTE_SIGNAL_URL__";

    const pc = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302",
        },
      ],
    });

    const setStatus = (msg) => {
      document.getElementById("status").textContent = msg;
      console.log("__STATUS__:" + msg);
    };

    // postJSON posts payload and returns the response, which it expects to
    // have the status want.
    async function postJSON(url, payload, want) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8",
        },
        body: JSON.stringify(payload),
      });
      if (response.status !== want) {
        const msg = await response.text();
        setStatus(`Failed to POST ${url}: ${response.status}: ${msg}`);
        throw new Error(`POST ${url} failed with ${response.status}`);
      }
      return response;
    }

    window.startRandomDataSender = async (datafile) => {
      let dataChannel = pc.createDataChannel("MyApp Channel");

      dataChannel.addEventListener("open", async (event) => {
        setStatus(`datasource started with delay of ${datafile.delay} seconds`);
        await new Promise((resolve) =>
          setTimeout(resolve, datafile.delay * 1000),
        );
        setStatus(`datasource started with random data`);

        // send size: 0 = no chunk size defined
        const sizeBuf = new ArrayBuffer(8);
        const sizeView = new DataView(sizeBuf);
        sizeView.setBigUint64(0, 0n, false);
        dataChannel.send(sizeBuf);

        const chunkSize = 1024;
        const buf = new Uint8Array(chunkSize);
        try {
          while (dataChannel.readyState === "open") {
            if (dataChannel.bufferedAmount > 16 * chunkSize) {
              // avoid filling up the buffer too much
              await new Promise((resolve) => setTimeout(resolve, 10));
              continue;
            }
            setStatus(
              `datasource: pushed: ${chunkSize} in buffer (total buffer: ${dataChannel.bufferedAmount})`,
            );

            crypto.getRandomValues(buf);
            dataChannel.send(buf.buffer);
          }
        } catch (err) {
          setStatus(`Data channel error: ${err}`);
        }
      });
    };

    window.startFileDataSender = async (datafile) => {
      sendFileCoordinator.setDelay(datafile.delay);

      let dataChannel = pc.createDataChannel("MyApp Channel");

      dataChannel.addEventListener("open", async (event) => {
        sendFileCoordinator.setDataChannel(dataChannel);
      });
    };

    async function sendFileOverDC(dataChannel, file, delay) {
      setStatus(`datasource started with delay of ${delay} seconds`);
      await new Promise((resolve) => setTimeout(resolve, delay * 1000));

      const fileSize = file.size;
      setStatus(`datasource starts sending file with totoal len: ${fileSize}`);

      // write size on channel
      const sizeBuf = new ArrayBuffer(8);
      const sizeView = new DataView(sizeBuf);
      sizeView.setBigUint64(0, BigInt(fileSize), false);
      dataChannel.send(sizeBuf);

      // send file data in chunks
      const chunkSize = 1024;
      let offset = 0;

      while (offset < fileSize) {
        if (dataChannel.bufferedAmount > 16 * chunkSize) {
          await new Promise((resolve) => setTimeout(resolve, 10));
          continue;
        }

        const chunk = file.slice(offset, offset + chunkSize);
        const arrayBuffer = await chunk.arrayBuffer();

        dataChannel.send(arrayBuffer);
        offset += arrayBuffer.byteLength;

        setStatus(`datasource sent ${offset}/${fileSize} bytes`);
      }
    }

    // Local candidates gathered before the session exists wait here.
    let candidatesBuffer = [];
    let sessionURL = null;

    function sendCandidate(candidate) {
      return postJSON(`${sessionURL}/candidates`, candidate, 204);
    }

    // readRemoteCandidates applies the server's candidates as it streams them.
    function readRemoteCandidates() {
      const events = new EventSource(`${sessionURL}/candidates`);
      events.onmessage = (event) => {
        pc.addIceCandidate(JSON.parse(event.data)).catch((err) =>
          setStatus(`Failed to add remote candidate: ${err}`),
        );
      };
      events.addEventListener("end-of-candidates", () => events.close());
      events.onerror = () => setStatus("Remote candidate stream failed");
    }

    async function startMediaAndOffer() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false,
      });
      document.getElementById("video1").srcObject = stream;
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      setStatus("Going to post offer to remote peer");
      const response = await postJSON(
        `${remoteSignalURL}/sessions`,
        {
          protocol: "webrtc",
          webrtc: { sdp: pc.localDescription.sdp, trickle: true },
        },
        201,
      );
      const session = await response.json();
      await pc.setRemoteDescription({ type: "answer", sdp: session.webrtc.sdp });
      setStatus(`Opened session ${session.id}`);

      sessionURL = `${remoteSignalURL}/sessions/${encodeURIComponent(session.id)}`;
      readRemoteCandidates();
      for (const candidate of candidatesBuffer) {
        try {
          await sendCandidate(candidate);
        } catch (err) {
          setStatus(`Failed post buffered candidate: ${err}`);
        }
      }
      candidatesBuffer = [];
      setStatus("Sent offer and flushed candidates");

      // set max bitrate of video stream
      const sender = pc
        .getSenders()
        .find((s) => s.track && s.track.kind === "video");
      if (sender) {
        const params = sender.getParameters();
        if (!params.encodings || params.encodings.length === 0)
          params.encodings = [{}];
        params.encodings[0].maxBitrate = 30_000_000; // TODO: make configurable
        await sender.setParameters(params);
      }
    }

    async function logStats() {
      while (true) {
        try {
          const stats = [];
          const sender = pc.getSenders().find((s) => s.track?.kind === "video");
          const report = await (sender ? sender.getStats() : pc.getStats());
          report.forEach((v) => {
            if (v && Object.prototype.hasOwnProperty.call(v, "targetBitrate")) {
              console.log("__WEBRTC_TR__:" + v.targetBitrate);
            }
          });
        } catch (e) {
          console.log("__WEBRTC_STATS_ERROR__:" + e.toString());
        }
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
    }
    logStats();

    startMediaAndOffer().catch((err) => {
      setStatus(`Failed: ${err}`);
    });

    pc.oniceconnectionstatechange = (e) => setStatus(pc.iceConnectionState);
    pc.onicecandidate = (event) => {
      if (!event.candidate) return;
      const candidate = event.candidate.toJSON();
      if (sessionURL === null) {
        candidatesBuffer.push(candidate);
      } else {
        sendCandidate(candidate).catch((err) =>
          setStatus(`Failed post candidate: ${err}`),
        );
      }
    };
  </script>
</html>
